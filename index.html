<style>
  :root { --bg:#fff4e6; --card:#ffffff; --ink:#3b3340; --sub:#7a6f7f; --shadow:0 6px 18px rgba(0,0,0,.10); }

  .story .en { display:block; font-size:18px; font-weight:800; padding:10px 6px 0; }
  .story .ko { display:block; font-size:14px; color:var(--sub); padding:2px 6px 12px; }
  .story { position:relative; }
  .story .badge { display:none; position:absolute; top:10px; left:10px; background:#ff7aa2; color:#fff; font-weight:800; font-size:15px; padding:6px 12px; border-radius:999px; box-shadow:0 3px 8px rgba(0,0,0,.2); }
  .story.today { outline:5px solid #ff7aa2; }
  .story.today .badge { display:block; }
  .today-box { text-align:center; margin:0 0 16px; font-size:18px; font-weight:800; }
</style>

<script>
  // 날짜에 따라 매일 다른 "오늘의 이야기"
  (function () {
    var now = new Date();
    var day = Math.floor((now.getTime() - now.getTimezoneOffset() * 60000) / 86400000);
    var cards = document.querySelectorAll(".story");
    var i = day % cards.length;
    var c = cards[i];
    c.classList.add("today");
    c.parentNode.insertBefore(c, cards[0]);   // 맨 앞으로
    document.getElementById("todayBox").textContent = "⭐ Today's Story: " + c.querySelector(".en").textContent;
  })();
</script>
