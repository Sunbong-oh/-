<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>❄️ Frozen</title>
<style>
  :root {
    --bg: #fff4e6; --card: #ffffff; --ink: #3b3340; --sub: #7a6f7f;
    --pink: #ff7aa2; --blue: #5fb0ff; --green: #2f9e48;
    --shadow: 0 6px 18px rgba(0,0,0,.10);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg:#2a2531; --card:#3a3343; --ink:#fbf5ff; --sub:#cfc4da; }
  }
  :root[data-theme="dark"] { --bg:#2a2531; --card:#3a3343; --ink:#fbf5ff; --sub:#cfc4da; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:"Noto Sans KR","Apple SD Gothic Neo",system-ui,sans-serif; padding:16px; min-height:100vh; }
  .wrap { max-width:540px; margin:0 auto; }
  .top { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; gap:8px; }
  .chip { border:none; background:var(--card); color:var(--ink); border-radius:999px; padding:8px 14px; font-size:15px; box-shadow:var(--shadow); }
  button.chip { cursor:pointer; }
  h1 { font-size:28px; text-align:center; margin:12px 0 6px; }
  h2 { font-size:22px; text-align:center; margin:4px 0 12px; }
  .sub { text-align:center; color:var(--sub); font-size:16px; margin:0 0 14px; line-height:1.6; }
  .card { background:var(--card); border-radius:24px; padding:16px; box-shadow:var(--shadow); margin-bottom:14px; }
  .pic { width:100%; aspect-ratio:4/3; object-fit:cover; border-radius:18px; display:block; background:#eee; }
  .big-btn { display:block; width:100%; border:none; border-radius:20px; padding:18px; margin-top:12px; font-size:21px; font-weight:800; cursor:pointer; color:#fff; background:var(--pink); box-shadow:0 5px 0 rgba(0,0,0,.15); }
  .big-btn:active { transform:translateY(3px); box-shadow:0 2px 0 rgba(0,0,0,.15); }
  .big-btn.ghost { background:var(--card); color:var(--ink); }
  .small-btn { display:block; margin:10px auto 0; border:none; border-radius:14px; padding:10px 16px; font-size:15px; cursor:pointer; background:var(--blue); color:#fff; font-weight:700; }
  .small-btn.ghost { background:transparent; color:var(--sub); text-decoration:underline; font-weight:400; }

  .mission { font-size:20px; line-height:1.6; text-align:center; margin:14px 4px 4px; font-weight:700; }
  .target { text-align:center; font-size:60px; margin-top:4px; }
  .target.hit { animation: shake .5s; }
  .hearts { text-align:center; font-size:24px; letter-spacing:3px; min-height:32px; }
  .who { text-align:center; font-size:17px; color:var(--sub); }
  .bar { display:flex; align-items:center; justify-content:center; gap:10px; }
  .bar .target { font-size:40px; margin:0; }

  .chapter { font-size:15px; color:var(--sub); text-align:center; margin:12px 0 0; font-weight:700; }
  .narr { font-size:19px; line-height:1.7; margin:8px 4px 6px; }
  .q { font-size:27px; font-weight:800; text-align:center; margin:12px 0 4px; line-height:1.3; }
  .q-ko { text-align:center; color:var(--sub); font-size:15px; margin-bottom:6px; }

  .mic { margin:12px auto 4px; width:116px; height:116px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:54px; background:var(--bg); }
  .mic.listen { background:#ffe1ea; animation: pulse 1.4s infinite; }
  .mic.talk { background:#e2f0ff; }
  .mic.off { background:#eee; filter:grayscale(1); }
  .mic-label { text-align:center; font-size:20px; font-weight:800; min-height:28px; }
  .heard { text-align:center; color:var(--sub); font-size:16px; min-height:24px; margin-top:4px; }
  .hint { text-align:center; margin-top:6px; }
  .hint .e { font-size:70px; line-height:1.1; display:block; }
  .hint .w { font-size:26px; font-weight:800; color:var(--pink); }
  .feedback { text-align:center; font-size:24px; font-weight:800; min-height:34px; margin-top:8px; }
  .feedback.ok { color:var(--green); }
  .opts { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px; }
  .opt { background:var(--bg); border-radius:18px; padding:12px 6px; text-align:center; border:3px solid transparent; }
  .opt .l { font-size:22px; font-weight:900; color:var(--pink); }
  .opt .e { font-size:44px; line-height:1.2; display:block; }
  .opt .w { font-size:20px; font-weight:800; display:block; }
  .opt.right { border-color:#2f9e48; background:#e3f7e6; }
  .opt.glow { border-color:var(--pink); }
  .talk-btn { display:block; width:100%; margin:12px 0 0; border:none; border-radius:22px; padding:20px; font-size:24px; font-weight:800; cursor:pointer; color:#fff; background:var(--pink); box-shadow:0 5px 0 rgba(0,0,0,.15); animation: pulse 1.6s infinite; }
  .talk-btn:active { transform:translateY(3px); }
  .notice { background:#fff0c2; color:#5a4a1a; border-radius:14px; padding:12px; font-size:15px; line-height:1.6; margin-top:12px; text-align:center; }
  .win { text-align:center; }
  .win .boom { font-size:66px; }
  .win p { font-size:19px; line-height:1.7; }

  .star-fx { position:fixed; font-size:44px; pointer-events:none; z-index:20; animation: pop 1s ease-out forwards; }
  @keyframes pop { 0%{transform:scale(.4);opacity:1} 100%{transform:translateY(-140px) scale(1.5);opacity:0} }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-8px)} 75%{transform:translateX(8px)} }
  @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.08)} }
  .hidden { display:none !important; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <button class="chip" id="homeBtn">🏠 처음으로</button>
    <div class="chip" id="starCount">⭐ 0</div>
  </div>
  <div id="screen"></div>
</div>

      const fem = /samantha|zira|aria|jenny|ava|allison|susan|joanna|salli|kendra|kimberly|female|woman|google us english/i;
      return all.find((v) => fem.test(v.name)) || all[0] || null;
    } catch (e) { return null; }
  }
  try { if ("speechSynthesis" in window) speechSynthesis.getVoices(); } catch (e) {}

  function webSay(text, lang, rate, finish) {
    try {
      if (!("speechSynthesis" in window)) { finish(); return; }
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = lang; u.rate = rate; u.pitch = 1.1;
      if (lang === "en-US") { const v = usFemaleVoice(); if (v) u.voice = v; }
      u.onend = finish; u.onerror = finish;
      clearTimeout(speakGuard);
      speakGuard = setTimeout(finish, text.length * 150 + 3000);   // onend가 안 오는 기기 대비
      speechSynthesis.speak(u);
    } catch (e) { finish(); }
  }

  function say(text, lang, done) {
    if (listening) stopListen(true);
    const id = ++sayId;
    const ko = lang.indexOf("ko") === 0;
    speaking = true; pendingDone = done || null; refreshMic();
    let ended = false;
    const finish = () => {
      if (ended || id !== sayId) return;
      ended = true; speaking = false; pendingDone = null; clearTimeout(speakGuard); refreshMic();
      if (done) done();
    };
    if (tts && ttsAllowed && ttsUsable) {
      tts.speak(text, { language: ko ? "ko" : "en-US", rate: ko ? 1 : 0.8, voice: voicePref }).then(finish).catch((e) => {
        const code = e && e.code;
        if (id !== sayId) return;                                  // 다른 말로 바뀜
        if (code === "not_granted") { ttsAllowed = false; finish(); return; }   // 사용자가 끈 경우: 다른 목소리로 대신 말하지 않음
        if (code === "stopped") { finish(); return; }
        if (code === "unavailable") ttsUsable = false;
        webSay(text, lang, ko ? 0.9 : 0.65, finish);              // 그 밖의 실패: 브라우저 음성
      });
    } else if (ttsAllowed) {
      webSay(text, lang, ko ? 0.9 : 0.65, finish);
    } else finish();
  }
  let pendingDone = null;
  function stopSpeak(runNext) {
    const next = pendingDone; pendingDone = null;
    sayId++; speaking = false; clearTimeout(speakGuard);
    try { speechSynthesis.cancel(); } catch (e) {}
    if (tts) tts.stop().catch(() => {});
    refreshMic();
    if (runNext && next) next();
  }
  const sayEn = (t, done) => say(t, "en-US", done);
  const sayKo = (t, done) => say(t, "ko-KR", done);

  // 시작 버튼을 누를 때 브라우저 음성을 깨워 둬요 (아이폰 등)
  function unlockAudio() {
    try { if ("speechSynthesis" in window) { const u = new SpeechSynthesisUtterance(" "); u.volume = 0; speechSynthesis.speak(u); } } catch (e) {}
  }

  // ===================== 듣기 (아이 → 게임) =====================
  // 🎤 버튼을 누르면 마이크가 켜지고, 대답을 들으면 꺼져요.
  let dict = null, dictLangOk = true;
  let rec = null;
  let listening = false, micDenied = false;
  let sessionText = "", listenTimer = null, endTimer = null, sessionOpen = false;
  let onHeard = null, onListenEnd = null;
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const LISTEN_MS = 8000;   // 한 번 누르면 최대 8초 들어요

  try {
    if (window.claude && typeof window.claude.use === "function") {
      window.claude.use("dictation").then((d) => {
        if (!d) return;
        dict = d;
        d.onFinal(({ text }) => heard(text, true));
        d.onPartial(({ text }) => { if (text) heard(text, false); });
        d.onState(({ state, reason }) => {
          if (state === "idle") {
            if (reason === "not_granted") micDenied = true;
            if (reason === "unavailable") dictLangOk = false;
            closeSession();
          }
          refreshMic();
        });
        refreshMic();
      }).catch(() => {});
    }
  } catch (e) {}

  function micAvailable() { return !!dict || !!SR; }

  // 반드시 버튼 클릭 안에서 바로 불러요.
  function startListen() {
    if (listening) return;
    if (speaking) stopSpeak();
    sessionText = ""; sessionOpen = true; listening = true;
    clearTimeout(listenTimer); clearTimeout(endTimer);
    listenTimer = setTimeout(() => stopListen(), LISTEN_MS);
    refreshMic();
    if (dict) {
      (dictLangOk ? dict.start({ language: "en" }) : dict.start()).catch((e) => {
        const c = e && e.code;
        if (c === "not_granted") micDenied = true;
        if (c === "unavailable") dictLangOk = false;
        closeSession(true);
      });
      return;
    }
    if (SR) {
      try {
        rec = new SR();
        rec.lang = "en-US"; rec.continuous = true; rec.interimResults = true; rec.maxAlternatives = 5;
        rec.onresult = (ev) => {
          for (let i = ev.resultIndex; i < ev.results.length; i++) {
            const r = ev.results[i]; const alts = [];
            for (let k = 0; k < r.length; k++) alts.push(r[k].transcript);
            heard(alts.join(" | "), r.isFinal);
          }
        };
        rec.onerror = (ev) => { if (ev.error === "not-allowed" || ev.error === "service-not-allowed") micDenied = true; };
        rec.onend = () => closeSession();
        rec.start();
      } catch (e) { closeSession(true); }
      return;
    }
    closeSession(true);
  }
  function stopListen(silent) {
    clearTimeout(listenTimer); clearTimeout(endTimer);
    if (silent) { sessionOpen = false; }
    try { if (dict && dict.active()) dict.stop().catch(() => {}); } catch (e) {}
    try { if (rec) rec.stop(); } catch (e) {}
    if (!dict || !dict.active()) closeSession();
  }
  function closeSession(failed) {
    clearTimeout(listenTimer); clearTimeout(endTimer);
    const was = sessionOpen;
    listening = false; sessionOpen = false; rec = null;
    refreshMic();
    if (was && onListenEnd) onListenEnd(sessionText, !!failed);
  }

  function heard(text, final) {
    if (!sessionOpen) return;
    if (final) sessionText = (sessionText + " " + text).trim();
    const shown = (final ? sessionText : (sessionText + " " + text)).split(" | ")[0].trim();
    const h = document.getElementById("heard");
    if (h && shown) h.textContent = "들린 말: " + shown;
    if (onHeard) onHeard(final ? sessionText : sessionText + " " + text, final);
    // 한 마디 듣고 조금 더 기다렸다가 끝내요
    if (final && sessionOpen) { clearTimeout(endTimer); endTimer = setTimeout(() => stopListen(), 1500); }
  }

  function norm(t) { return t.toLowerCase().replace(/[.,!?'"…]/g, " ").replace(/\s+/g, " ").trim(); }
  function lev(a, b) {
    const d = [];
    for (let i = 0; i <= a.length; i++) d[i] = [i];
    for (let j = 0; j <= b.length; j++) d[0][j] = j;
    for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
      d[i][j] = Math.min(d[i-1][j] + 1, d[i][j-1] + 1, d[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1));
    return d[a.length][b.length];
  }
  function matches(text, answer) {
    const t = norm(text);
    const words = t.split(/[\s|]+/).filter(Boolean);
    const list = ALIAS[answer] || [answer];
    for (const al of list) {
      if (al.indexOf(" ") >= 0 || /[가-힣]/.test(al)) { if (t.indexOf(al) >= 0) return true; }
      else if (words.indexOf(al) >= 0) return true;
    }
    if (answer.length >= 4 && answer.indexOf(" ") < 0) for (const w of words) if (lev(w, answer) <= 1) return true;
    return false;
  }
  // ===== 소리 비교: 받아쓰기가 철자를 틀려도 소리가 가까우면 인정 =====
  const LETTER = { a:"ay", b:"bee", c:"see", d:"dee", e:"ee", f:"ef", g:"jee", h:"aych", i:"eye", j:"jay", k:"kay", l:"el",
    m:"em", n:"en", o:"oh", p:"pee", q:"cue", r:"ar", s:"es", t:"tee", u:"you", v:"vee", w:"dubyou", x:"ex", y:"why", z:"zee" };
  function pkey(w) {
    w = w.toLowerCase().replace(/[^a-z]/g, "");
    if (!w) return "";
    if (w.length === 1 && LETTER[w]) w = LETTER[w];
    w = w.replace(/ph/g, "f").replace(/ck/g, "k").replace(/c(?=[eiy])/g, "s").replace(/c/g, "k").replace(/q/g, "k")
         .replace(/x/g, "ks").replace(/z/g, "s").replace(/wh/g, "w").replace(/^kn/, "n").replace(/gh/g, "").replace(/th/g, "t")
         .replace(/(ee|ea|ie|ey)/g, "i").replace(/y$/, "i").replace(/(oo|ou|ew|ue)/g, "u").replace(/(ai|ay|ei)/g, "e")
         .replace(/(oa|ow|oh)/g, "o").replace(/e$/, "").replace(/(.)\1+/g, "$1");
    return w;
  }
  function sim(a, b) { if (!a || !b) return 0; return 1 - lev(a, b) / Math.max(a.length, b.length); }
  function bestSim(text, target) {
    const tk = pkey(target);
    const words = norm(text).split(/[\s|]+/).filter(Boolean);
    let best = sim(pkey(words.join("")), tk);
    for (let i = 0; i < words.length; i++) {
      best = Math.max(best, sim(pkey(words[i]), tk));
      if (i + 1 < words.length) best = Math.max(best, sim(pkey(words[i] + words[i + 1]), tk));
    }
    return best;
  }
  function soundsLike(text, right, wrong) {
    const r = bestSim(text, right), w = bestSim(text, wrong);
    return r >= 0.5 && r > w + 0.15;
  }
  window.__soundsLike = soundsLike;

  function findWord(text, list) {
    const words = norm(text).split(/[\s|]+/);
    for (const w of list) if (words.indexOf(w) >= 0) return w;
    return null;
  }

  // ===================== 화면 도우미 =====================
  const $s = document.getElementById("screen");
  let timers = [];
  function later(fn, ms) { const id = setTimeout(fn, ms); timers.push(id); return id; }
  function clearAll() { timers.forEach(clearTimeout); timers = []; onHeard = null; onListenEnd = null; waiting = false; if (listening) stopListen(true); }
  function esc(t) { return String(t).replace(/[&<>"]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
  function josa(word, a, b) {
    const ch = word.charCodeAt(word.length - 1);
    if (ch < 0xAC00 || ch > 0xD7A3) return word + b;
    return word + (((ch - 0xAC00) % 28) ? a : b);
  }
  function updateStars() { document.getElementById("starCount").textContent = "⭐ " + data.stars; }
  function starFx() {
    const s = document.createElement("div");
    s.className = "star-fx"; s.textContent = "⭐";
    s.style.left = (window.innerWidth / 2 - 22) + "px"; s.style.top = (window.innerHeight / 2) + "px";
    document.body.appendChild(s); setTimeout(() => s.remove(), 1000);
  }

  function micHtml() {
    return '<div class="mic" id="mic">🎤</div>' +
           '<div class="mic-label" id="micLabel"></div>' +
           '<div class="heard" id="heard"></div>' +
           '<button class="talk-btn hidden" id="micBtn">🎤 눌러서 말하기</button>' +
           '<button class="small-btn ghost hidden" id="stopBtn">⏹ 소리 멈추기</button>' +
           '<div class="notice hidden" id="micNotice"></div>';
  }
  let waiting = false;   // 아이 대답을 기다리는 중
  function refreshMic() {
    const mic = document.getElementById("mic");
    if (!mic) return;
    const label = document.getElementById("micLabel");
    const btn = document.getElementById("micBtn");
    const stop = document.getElementById("stopBtn");
    const note = document.getElementById("micNotice");
    btn.classList.add("hidden"); note.classList.add("hidden"); stop.classList.add("hidden");
    if (speaking) {
      mic.className = "mic talk"; mic.textContent = "🔊"; label.textContent = "잘 들어 봐요…";
      stop.classList.remove("hidden");
      return;
    }
    mic.textContent = "🎤";
    if (listening) { mic.className = "mic listen"; label.textContent = "영어로 말해 보세요!"; return; }
    mic.className = "mic off"; label.textContent = "";
    if (!micAvailable() || micDenied) {
      note.textContent = micDenied
        ? "마이크가 꺼져 있어요. 페이지의 권한 메뉴에서 마이크를 허용한 뒤 다시 눌러 주세요."
        : "이 기기에서는 마이크를 쓸 수 없어요. 컴퓨터나 안드로이드의 크롬(Chrome)에서 열어 주세요.";
      note.classList.remove("hidden");
      if (micDenied && waiting) btn.classList.remove("hidden");
      return;
    }
    if (waiting) { btn.classList.remove("hidden"); label.textContent = "🎤를 누르고 영어로 말해요"; }
  }
  function wireMic() {
    document.getElementById("micBtn").onclick = () => { micDenied = false; startListen(); };
    document.getElementById("stopBtn").onclick = () => { stopSpeak(true); };
    refreshMic();
  }

  // ===================== 게임 상태 =====================
  let game = null;
  const N = STORY.chapters.length;
  function hearts() { return "❤️".repeat(game.hp) + "🤍".repeat(N - game.hp); }

  // ===================== 1. 시작 =====================
  function showStart() {
    clearAll(); stopSpeak();
    $s.innerHTML =
      '<h1>' + esc(STORY.title) + '</h1>' +
      '<p class="sub">' + esc(STORY.ko) + ' · 영어 질문에 <b>영어로 말해서</b> 대답해요!</p>' +
      '<div class="card"><img class="pic" src="' + STORY.cover + '" alt="' + esc(STORY.title) + '"></div>' +
      '<button class="big-btn" id="go">▶ 시작하기</button>' +
      '<div class="card" id="voiceBox" style="margin-top:14px">' +
        '<div class="q-ko" style="font-size:15px">🗣️ 선생님 목소리 고르기 (미국 영어) — 눌러서 들어 보세요</div>' +
        '<div class="opts" style="grid-template-columns:1fr 1fr">' + VOICES.map((v) =>
          '<button class="opt vbtn" data-v="' + v.id + '" style="cursor:pointer;color:var(--ink)"><span class="w">' + v.label + '</span></button>'
        ).join("") + '</div>' +
      '</div>' +
      '<p class="sub" style="margin-top:12px;font-size:14px">🔊 소리를 켜 주세요. 처음 🎤를 누를 때 마이크 허용을 눌러 주세요.</p>';
    const markVoice = () => document.querySelectorAll(".vbtn").forEach((b) => b.classList.toggle("right", b.dataset.v === voicePref));
    markVoice();
    document.querySelectorAll(".vbtn").forEach((b) => {
      b.onclick = () => { unlockAudio(); setVoice(b.dataset.v); markVoice(); sayEn("Hello! I am your English teacher. Let's play!"); };
    });
    // Claude 음성이 없는 기기에서는 목소리 고르기 대신 안내
    later(() => {
      if (!tts) document.getElementById("voiceBox").innerHTML =
        '<div class="q-ko" style="font-size:15px">🗣️ 이 기기의 미국 영어 여자 목소리로 읽어 줘요.</div>';
    }, 1500);
    document.getElementById("go").onclick = () => { unlockAudio(); showGreet(0); };
  }

  // 질문 하나를 묻고, 🎤로 대답을 듣는 공통 흐름
  function askLoop(o) {
    // o: { q, judge(text)->"ok"|"no", onOk(text), onNo(tries), hint1(), silenceHint }
    let solved = false, tries = 0, silenceTimer = null;
    const ask = () => { waiting = false; refreshMic(); sayEn(o.q, () => { waiting = true; refreshMic(); arm(); }); };
    function arm() {
      clearTimeout(silenceTimer);
      if (o.hint1) silenceTimer = later(() => { if (!solved) o.hint1(); }, SILENCE_HINT_MS);
    }
    onHeard = (text) => {
      if (solved) return;
      if (o.judge(text) === "ok") { solved = true; waiting = false; clearTimeout(silenceTimer); stopListen(true); o.onOk(text); }
    };
    onListenEnd = (text, failed) => {
      if (solved || !waiting) return;
      if (failed && micDenied) { refreshMic(); return; }
      if (!norm(text)) {
        const fb = document.getElementById("fb");
        fb.className = "feedback"; fb.textContent = "잘 안 들렸어요. 🎤를 누르고 크게 말해 볼까?";
        refreshMic(); return;
      }
      if (o.anyAnswer) { solved = true; waiting = false; o.onOk(text); return; }
      if (o.judge(text, true) === "ok") { solved = true; waiting = false; clearTimeout(silenceTimer); o.onOk(text); return; }
      tries += 1;
      waiting = false; refreshMic();
      o.onNo(tries, () => { waiting = true; refreshMic(); arm(); });
    };
    return ask;
  }

  // ===================== 2. 인사: 기분, 날씨 =====================
  const GREET = [
    { q:"How do you feel?", qko:"오늘 기분이 어때? (happy, sleepy, hungry…)", words:["happy","sleepy","hungry","sad","good","tired","angry"], reply:(w) => w ? "You are " + w + "!" : "Thank you!" },
    { q:"How is the weather?", qko:"오늘 날씨는 어때? (sunny, rainy, cloudy, snowy)", words:["sunny","rainy","cloudy","snowy","windy","cold","hot"], reply:(w) => w ? "It is " + w + "!" : "Thank you!" }
  ];
  function showGreet(i) {
    clearAll();
    const g = GREET[i];
    const goNext = () => (i + 1 < GREET.length ? showGreet(i + 1) : showMission());
    $s.innerHTML =
      '<h2>👋 Hello!</h2>' +
      '<div class="card">' +
        '<div class="q">' + esc(g.q) + '</div>' +
        '<div class="q-ko">' + esc(g.qko) + '</div>' +
        micHtml() +
        '<div class="feedback ok" id="fb"></div>' +
      '</div>' +
      '<button class="big-btn hidden" id="next">다음 ▶</button>' +
      '<button class="small-btn" id="hear">🔊 다시 듣기</button>' +
      '<button class="small-btn ghost" id="skip">건너뛰기</button>';
    wireMic();
    const ask = askLoop({
      q: g.q, anyAnswer: true,
      judge: (text) => findWord(text, g.words) ? "ok" : "no",
      onOk: (text) => {
        const w = findWord(text, g.words);
        const fb = document.getElementById("fb");
        fb.className = "feedback ok"; fb.textContent = g.reply(w) + " 😊";
        starFx(); sayEn(g.reply(w));
        document.getElementById("next").classList.remove("hidden");
        document.getElementById("skip").classList.add("hidden");
      },
      onNo: () => {}
    });
    later(ask, 400);
    document.getElementById("hear").onclick = ask;
    document.getElementById("skip").onclick = goNext;
    document.getElementById("next").onclick = goNext;
  }

  // ===================== 3. 오늘은 누굴 해치울까? =====================
  function showMission() {
    clearAll();
    const now = new Date();
    const day = Math.floor((now.getTime() - now.getTimezoneOffset() * 60000) / 86400000);   // 오늘 날짜 번호
    if (data.playDay !== day) { data.playDay = day; data.playsToday = 0; }
    const k = day + data.playsToday;            // 매일 바뀌고, 같은 날 다시 하면 다음 것
    data.playsToday += 1;
    const t = STORY.targets[k % STORY.targets.length];
    const quiz = STORY.chapters.map((ch, ci) => ch.quiz[(k + ci) % ch.quiz.length]);
    save(data);
    game = { t, quiz, idx: 0, hp: N };
    const line = "Who will we beat today?  " + t.why_en + "  Let's beat " + t.en + "!";
    $s.innerHTML =

      '<div class="card">' +
        '<img class="pic" src="' + (t.img || STORY.cover) + '" alt="' + esc(t.who) + '">' +
        '<div class="mission">' + esc(t.why_en) + '</div>' +
        '<div class="q-ko">' + esc(t.why) + '</div>' +
        '<div class="target">' + t.e + '</div>' +
        '<div class="who">' + esc(t.who) + '</div>' +
        '<div class="hearts">' + hearts() + '</div>' +
        '<p class="sub" style="margin:8px 0 0">퀴즈를 맞힐 때마다 하트가 하나씩 없어져요!</p>' +
      '</div>' +
      '<button class="big-btn" id="go">⚔️ Let\'s beat ' + esc(t.en) + '!</button>' +
      '<button class="small-btn" id="again">🔊 다시 듣기</button>';
    later(() => sayEn(line), 300);
    document.getElementById("again").onclick = () => sayEn(line);
    document.getElementById("go").onclick = () => { stopSpeak(); showChapter(); };
  }

  // ===================== 4. 이야기 장면 + 영어 퀴즈 =====================
  function showChapter() {
    clearAll();
    const ch = STORY.chapters[game.idx];
    const qz = game.quiz[game.idx];
    // 선택지 A, B (순서는 매번 섞어요)
    const opts = Math.random() < 0.5 ? [[qz.a, qz.e], qz.b] : [qz.b, [qz.a, qz.e]];
    const cap = (w) => w.replace(/\b\w/g, (c) => c.toUpperCase());
    const qText = qz.q.replace(/\s+(A|An|The|In the|In a|Under the|To the|It is)…$/, "");
    const choices = cap(opts[0][0]) + "?  or " + cap(opts[1][0]) + "?";
    const spoken = qText + "  " + choices;
    $s.innerHTML =
      '<div class="card bar"><div class="target" id="tg">' + game.t.e + '</div><div class="hearts" id="hp">' + hearts() + '</div></div>' +
      '<div class="card">' +
        '<div class="chapter">Quiz ' + (game.idx + 1) + ' / ' + N + '</div>' +
        '<div class="q">' + esc(qText) + '</div>' +
        '<div class="q-ko">' + esc(qz.qko) + '</div>' +
        '<img class="pic" src="' + ch.img + '" alt="' + esc(STORY.title) + '">' +
        '<div class="opts">' + opts.map((o, i) =>
          '<div class="opt" id="opt' + i + '"><span class="e">' + o[1] + '</span><span class="w">' + esc(cap(o[0])) + '</span></div>'
        ).join("") + '</div>' +
        micHtml() +
        '<div class="hint" id="hint"></div>' +
        '<div class="feedback" id="fb"></div>' +
      '</div>' +
      '<button class="big-btn hidden" id="next">다음 이야기 ▶</button>' +
      '<button class="small-btn" id="hear">🔊 Again</button>';
    wireMic();

    const rightIdx = opts[0][0] === qz.a ? 0 : 1;
    const showHint = (level) => {
      if (level >= 2) document.getElementById("opt" + rightIdx).classList.add("glow");
    };
    const ask = askLoop({
      q: spoken,
      judge: (text, final) => {
        if (matches(text, qz.a)) return "ok";
        if (matches(text, qz.b[0].toLowerCase())) return "no";
        // 다 듣고 나서: 소리가 두 선택지 중 정답에 더 가까우면 인정
        if (final && soundsLike(text, qz.a, qz.b[0].toLowerCase())) return "ok";
        return "no";
      },
      hint1: () => showHint(1),
      onOk: () => {
        game.hp -= 1; data.stars += 1; save(data); updateStars();
        starFx();
        const tg = document.getElementById("tg");
        tg.classList.remove("hit"); void tg.offsetWidth; tg.classList.add("hit");
        document.getElementById("hp").textContent = hearts();
        const fb = document.getElementById("fb");
        fb.className = "feedback ok"; fb.textContent = "⭐ " + cap(qz.a) + "! Good job!";
        document.getElementById("opt" + rightIdx).classList.add("right");
        sayEn(cap(qz.a) + "! Good job!");
        const nx = document.getElementById("next");
        nx.textContent = game.idx + 1 >= N ? "⚔️ 마지막 공격! ▶" : "다음 이야기 ▶";
        nx.classList.remove("hidden");
      },
      onNo: (tries, resume) => {
        const fb = document.getElementById("fb");
        fb.className = "feedback"; fb.textContent = "Try again! 다시 말해 볼까? 🙂";
        if (tries >= 2) { showHint(2); sayEn("Try again! Say, " + cap(qz.a) + ".", resume); }
        else { sayEn("Try again!  " + choices, resume); }
      }
    });
    // 영어 질문만 천천히 읽어 줘요
    later(ask, 500);
    document.getElementById("hear").onclick = ask;
    document.getElementById("next").onclick = () => {
      stopSpeak();
      game.idx += 1;
      if (game.idx >= N) showWin(); else showChapter();
    };
  }

  // ===================== 5. 해치웠다! + 이야기 끝 =====================
  function showWin() {
    clearAll();
    const t = game.t;
    $s.innerHTML =
      '<div class="card win">' +
        '<img class="pic" src="' + STORY.finale + '" alt="승리">' +
        '<div class="boom">🎉</div>' +
        '<p><b>' + esc(josa(t.who, "을", "를")) + ' 해치웠어요!</b><br>' + esc(STORY.ending) + '</p>' +
        '<p>별 ' + N + '개를 모았어요 ⭐</p>' +
      '</div>' +
      '<button class="big-btn" id="again">🔁 다시 하기 (다른 퀴즈)</button>';
    sayEn("We did it! Hooray! " + STORY.ending);
    document.getElementById("again").onclick = () => { stopSpeak(); showMission(); };
  }

  document.getElementById("homeBtn").onclick = showStart;
  updateStars();
  showStart();

  // 테스트용
  window.__say = (t) => { if (!sessionOpen) { sessionText = ''; sessionOpen = true; listening = true; } heard(t, true); stopListen(); };
})();
</script>
</body>
</html>
