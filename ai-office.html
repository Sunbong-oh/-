<title>AI 오피스</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=DotGothic16&display=swap">
<style>
/* Layout: 상단 바(이름·연결 상태·탭) 아래에 홈/사무실/루틴 세 화면. 홈은 요약 타일, 건물 미니맵, 호출 목록, 최근 움직임. 단일 다크 톤. */
:root{
  color-scheme:dark;
  --bg:#14171c; --floor:#1b2027; --wall:#2c333d; --fg:#e6e9ee; --mute:#8b94a1;
  --run:#4ade80; --wait:#fbbf24; --review:#60a5fa; --idle:#7dd3c0; --off:#4b5563; --bad:#f87171;
  --font:'Noto Sans KR',system-ui,sans-serif; --pix:'DotGothic16','Noto Sans KR',monospace;
}
body{background:var(--bg);color:var(--fg);font-family:var(--font);margin:0;
  padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));line-height:1.5}
.wrap{max-width:1100px;margin:0 auto;display:grid;gap:18px}
h1{font-family:var(--pix);font-size:26px;margin:0;font-weight:400;letter-spacing:.02em}
h2{font-family:var(--pix);font-size:18px;margin:0;font-weight:400}
button{font:inherit;color:inherit}
.bar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.live{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12px;color:var(--mute)}
.pill{border:1px solid var(--wall);border-radius:999px;padding:2px 10px;display:inline-flex;gap:6px;align-items:center;background:var(--floor)}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--c,var(--off));display:block}
.pill.on i{animation:blink 1.6s ease-in-out infinite}
@keyframes blink{50%{opacity:.35}}
.btn{border:1px solid var(--wall);background:var(--floor);border-radius:6px;padding:4px 12px;cursor:pointer;font-size:12px}
.btn:hover{border-color:var(--fg)}
.tabs{display:flex;gap:6px;border-bottom:2px solid var(--wall)}
.tab{background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-2px;padding:8px 16px;cursor:pointer;font-family:var(--pix);font-size:16px;color:var(--mute)}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--run)}
.btn:focus-visible,.tab:focus-visible,.chip:focus-visible,.desk:focus-visible,.mini:focus-visible{outline:2px solid var(--review);outline-offset:2px}
.view[hidden]{display:none}
.view{display:grid;gap:18px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.tile{background:var(--floor);border:1px solid var(--wall);border-radius:4px;padding:12px 14px;display:grid;gap:2px}
.tile b{font-family:var(--pix);font-size:34px;font-weight:400;color:var(--c);font-variant-numeric:tabular-nums;line-height:1.1}
.tile span{font-size:12px;color:var(--mute)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px}
.panel{background:var(--floor);border:1px solid var(--wall);border-radius:4px;padding:14px;display:grid;gap:10px;align-content:start;min-width:0}
.panel.warn{border-color:var(--wait)}
.list{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.list li{font-size:13px;display:grid;grid-template-columns:minmax(0,190px) 1fr;gap:2px 12px}
.list li strong{font-weight:700;overflow-wrap:anywhere}
.list li span{color:var(--mute);overflow-wrap:anywhere}
.list li em{font-style:normal;color:var(--mute);font-size:11px}
@media(max-width:600px){.list li{grid-template-columns:1fr}}
.empty{color:var(--mute);font-size:13px;margin:0}
.map{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.mini{background:var(--bg);border:3px solid var(--wall);border-radius:4px;padding:10px;text-align:left;cursor:pointer;display:grid;gap:8px;align-content:start}
.mini:hover{border-color:var(--fg)}
.mini h3{margin:0;font-family:var(--pix);font-weight:400;font-size:15px}
.mini small{color:var(--mute);font-size:11px}
.dots{display:flex;flex-wrap:wrap;gap:4px}
.dots i{width:12px;height:12px;border-radius:2px;background:var(--c)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--wall);background:var(--floor);border-radius:6px;padding:6px 12px;font-size:13px;cursor:pointer;display:flex;gap:8px;align-items:center}
.chip[aria-pressed="true"]{border-color:var(--fg)}
.dot{width:10px;height:10px;border-radius:2px;background:var(--c,var(--off));flex:none}
.chip b{font-variant-numeric:tabular-nums}
.rooms{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,480px),1fr));gap:16px}
.room{background:var(--floor);border:3px solid var(--wall);border-radius:4px;padding:14px;min-width:0}
.room header{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.room header span{color:var(--mute);font-size:12px}
.desks{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.desk{background:var(--bg);border:1px solid var(--wall);border-radius:4px;padding:10px;display:grid;gap:6px;min-width:0;text-align:left;cursor:pointer}
a.desk,a.desk:hover{color:inherit;text-decoration:none}
.desk:hover{border-color:var(--c)}
a.name-link{color:inherit;text-decoration:underline;text-decoration-color:var(--wall);text-underline-offset:3px}
a.name-link:hover{text-decoration-color:var(--fg)}
.go{font-size:11px;color:var(--c)}
.desk.dim{opacity:.55}
.top{display:flex;gap:8px;align-items:center}
.avatar{width:22px;height:26px;flex:none;background:var(--c);clip-path:polygon(25% 0,75% 0,75% 35%,100% 35%,100% 100%,0 100%,0 35%,25% 35%)}
.desk.live .avatar{animation:bob 1s steps(2) infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
@media(prefers-reduced-motion:reduce){.desk.live .avatar,.pill.on i{animation:none}}
.name{font-size:13px;font-weight:700;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:4px 8px;font-size:11px;color:var(--mute)}
.tag{border:1px solid var(--wall);padding:0 6px;border-radius:3px}
.state{font-size:12px;color:var(--c);font-weight:500}
.detail{font-size:12px;margin:0;overflow-wrap:anywhere}
.desk .detail{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;color:var(--mute)}
.sched{display:grid;gap:8px}
.row{display:grid;grid-template-columns:150px minmax(0,1fr) auto;gap:4px 14px;background:var(--floor);border:1px solid var(--wall);border-radius:4px;padding:10px 14px;font-size:13px;align-items:center}
.row .when{font-family:var(--pix);color:var(--run);font-size:14px;overflow-wrap:anywhere}
.row small{color:var(--mute);display:block;overflow-wrap:anywhere}
.row .next{font-variant-numeric:tabular-nums;color:var(--mute);font-size:12px;text-align:right}
@media(max-width:600px){.row{grid-template-columns:1fr}.row .next{text-align:left}}
.note{font-size:12px;color:var(--mute);margin:0}
</style>

<div class="wrap">
  <div class="bar">
    <h1>AI 오피스</h1>
    <div class="live">
      <span class="pill" id="conn"><i></i><span id="connText">연결 확인 중</span></span>
      <span id="stamp"></span>
      <button class="btn" id="refresh" type="button" hidden>지금 새로고침</button>
      <button class="btn" id="allow" type="button" hidden>연결 허용</button>
    </div>
  </div>

  <div class="tabs" role="tablist" aria-label="화면">
    <button class="tab" role="tab" id="tab-home" data-v="home" aria-selected="true">홈</button>
    <button class="tab" role="tab" id="tab-rooms" data-v="rooms" aria-selected="false">사무실</button>
    <button class="tab" role="tab" id="tab-routines" data-v="routines" aria-selected="false">루틴</button>
  </div>

  <section class="view" id="v-home" aria-labelledby="tab-home">
    <div class="tiles" id="tiles"></div>
    <div class="panel warn"><h2>지금 내 답이 필요한 책상</h2><ul class="list" id="needs"></ul></div>
    <div class="cols">
      <div class="panel"><h2>지금 일하는 책상</h2><ul class="list" id="working"></ul></div>
      <div class="panel"><h2>최근 움직임</h2><ul class="list" id="recent"></ul></div>
    </div>
    <div class="panel"><h2>건물 지도</h2><div class="map" id="map"></div></div>
  </section>

  <section class="view" id="v-rooms" aria-labelledby="tab-rooms" hidden>
    <div class="chips" id="chips" role="group" aria-label="상태 필터"></div>
    <div class="rooms" id="rooms"></div>
  </section>

  <section class="view" id="v-routines" aria-labelledby="tab-routines" hidden>
    <h2>자동으로 도는 예약 루틴 (켜져 있는 것)</h2>
    <div class="sched" id="sched"></div>
    <p class="note" id="schedNote"></p>
  </section>

  <p class="note">클라우드는 Anthropic 서버에서, 내 PC는 내 컴퓨터에 연결된 세션(Remote Control)에서 돌아가는 책상입니다. 연결되면 1분마다 자동으로 다시 읽어 옵니다. 연결이 안 되면 13:25 KST에 찍어 둔 스냅샷을 보여 줍니다.</p>
</div>

}
function roomOf(title){
  if(/영어 ?요일|한글|도안|게임|자석|아이|동화|공주/.test(title))return 'kids';
  if(/제주|계정|라이프|쿠팡|영어강좌|사이트 계정|정산/.test(title))return 'life';
  if(/주식|증시|브리핑|리포트|실적|수급|강세|밸류|외국인|데일리|팟캐스트|종목|IonQ|투자|시장/.test(title))return 'stock';
  return 'tool';
}
function stOf(s){
  if(s.session_status==='SESSION_STATUS_ARCHIVED')return 'off';
  var b=s.status_bucket||'';
  if(/WORKING/.test(b)||s.session_status==='SESSION_STATUS_RUNNING')return 'run';
  if(/BLOCKED/.test(b))return 'wait';
  if(/REVIEW/.test(b))return 'review';
  return 'idle';
}
// 응답이 JSON 객체이든, 앞에 설명 글이 붙은 문자열이든 배열을 찾아 낸다.
function dig(p){
  if(typeof p==='string'){
    var i=p.indexOf('{"');var j=p.lastIndexOf('}');
    if(i<0||j<i)return null;
    try{p=JSON.parse(p.slice(i,j+1))}catch(e){return null}
  }
  if(!p)return null;
  if(Array.isArray(p))return p;
  if(p.ccr&&Array.isArray(p.ccr.data))return p.ccr.data;
  if(Array.isArray(p.data))return p.data;
  if(Array.isArray(p.sessions))return p.sessions;
  if(Array.isArray(p.triggers))return p.triggers;
  return null;
}
function normSessions(arr){
  return arr.map(function(s){
    var pt=s.post_turn_summary||{};
    var st=stOf(s);
    return{room:roomOf(s.title||''),name:s.title||'(제목 없음)',st:st,
      loc:s.environment_kind==='bridge'?'p':'c',time:kst(s.updated_at),
      text:(st==='wait'?pt.needs_action:null)||pt.recent_action||pt.needs_action||'',
      ts:Date.parse(s.updated_at)||0,id:s.id};
  });
}
function normSched(arr,sessions){
  var byId={};sessions.forEach(function(s){if(s.id)byId[s.id]=s.name});
  return arr.filter(function(t){return t.enabled&&t.cron_expression}).map(function(t){
    var cron=String(t.cron_expression).replace(/^CRON_TZ=\S+\s+/,'');
    var tz=(String(t.cron_expression).match(/^CRON_TZ=(\S+)/)||[])[1]||'UTC';
    var lr=t.last_run&&t.last_run.status?(/SUCCEEDED/.test(t.last_run.status)?'직전 성공':'직전 실패'):'';
    var prompt=(t.derived_state&&t.derived_state.prompt)||'';
    return{when:cron+' ('+tz+')',name:t.name,
      sub:(byId[t.persistent_session_id]?byId[t.persistent_session_id]+' 책상에서 실행. ':'')+prompt.slice(0,90),
      next:(t.next_run_at?'다음 '+kst(t.next_run_at):'')+(lr?' · '+lr:'')};
  });
}

function sortS(a,b){
  var o={wait:0,run:1,review:2,idle:3,off:4};
  return (o[a.st]-o[b.st])||(b.ts-a.ts);
}
function liItem(s,showText){
  var li=el('li');var st=el('strong');
  if(s.id){var a=el('a','name-link',s.name);a.href=SURL+s.id;a.target='_blank';a.rel='noopener';st.appendChild(a)}else st.textContent=s.name;
  li.appendChild(st);
  var r=el('div');
  if(showText)r.appendChild(el('span',null,s.text||'기록 없음'));
  var e=el('em',null,(s.loc==='p'?'내 PC':'클라우드')+' · '+s.time);
  r.appendChild(el('br'));r.appendChild(e);li.appendChild(r);return li;
}
function fillList(id,items,empty,showText){
  var ul=$(id);ul.textContent='';
  if(!items.length){var li=el('li');li.appendChild(el('span','empty',empty));ul.appendChild(li);return}
  items.forEach(function(s){ul.appendChild(liItem(s,showText))});
}
function home(){
  var S=state.sessions;
  var t=$('tiles');t.textContent='';
  Object.keys(ST).forEach(function(k){
    var n=S.filter(function(s){return s.st===k}).length;
    var d=el('div','tile');d.style.setProperty('--c',ST[k].c);
    d.appendChild(el('b',null,n));d.appendChild(el('span',null,ST[k].t));t.appendChild(d);
  });
  fillList('needs',S.filter(function(s){return s.st==='wait'}).sort(sortS),'답을 기다리는 책상이 없습니다.',true);
  fillList('working',S.filter(function(s){return s.st==='run'}).sort(sortS),'지금 작업 중인 책상이 없습니다.',true);
  fillList('recent',S.filter(function(s){return s.st!=='off'}).sort(function(a,b){return b.ts-a.ts||0}).slice(0,6),'기록이 없습니다.',true);
  if(!state.live){ // 스냅샷은 ts가 없어 입력 순서를 그대로 둔다
    fillList('recent',S.filter(function(s){return s.st!=='off'&&s.time}).sort(function(a,b){return a.time<b.time?1:-1}).slice(0,6),'기록이 없습니다.',true);
  }
  var m=$('map');m.textContent='';
  ROOMS.forEach(function(r){
    var items=S.filter(function(s){return s.room===r[0]}).sort(sortS);
    var b=el('button','mini');b.type='button';b.id='mini-'+r[0];
    b.appendChild(el('h3',null,r[1]));
    var dots=el('div','dots');
    items.forEach(function(s){var i=el('i');i.style.setProperty('--c',ST[s.st].c);i.title=s.name+' · '+ST[s.st].t;dots.appendChild(i)});
    b.appendChild(dots);b.appendChild(el('small',null,'책상 '+items.length+'개 · 눌러서 보기'));
    b.onclick=function(){go('rooms')};m.appendChild(b);
  });
}
function chips(){
  var box=$('chips');box.textContent='';
  Object.keys(ST).forEach(function(k){
    var n=state.sessions.filter(function(d){return d.st===k}).length;
    var b=el('button','chip');b.type='button';b.id='chip-'+k;
    b.setAttribute('aria-pressed',filter===k?'true':'false');
    var dot=el('span','dot');dot.style.setProperty('--c',ST[k].c);
    b.appendChild(dot);b.appendChild(el('span',null,ST[k].t));b.appendChild(el('b',null,n));
    b.onclick=function(){filter=(filter===k?null:k);chips();rooms()};
    box.appendChild(b);
  });
}
var open={};
function rooms(){
  var box=$('rooms');box.textContent='';
  ROOMS.forEach(function(r){
    var items=state.sessions.filter(function(d){return d.room===r[0]&&(!filter||d.st===filter)}).sort(sortS);
    if(!items.length)return;
    var room=el('section','room');
    var h=el('header');h.appendChild(el('h2',null,r[1]));h.appendChild(el('span',null,r[2]+' · 책상 '+items.length+'개'));
    room.appendChild(h);
    var g=el('div','desks');
    items.forEach(function(d,i){
      var s=ST[d.st];var key=d.name;
      var b=el(d.id?'a':'div','desk'+(d.st==='run'?' live':'')+(d.st==='off'?' dim':''));
      b.id='desk-'+r[0]+'-'+i;b.style.setProperty('--c',s.c);
      if(d.id){b.href=SURL+d.id;b.target='_blank';b.rel='noopener'}
      var top=el('div','top');top.appendChild(el('span','avatar'));
      var tx=el('div');tx.appendChild(el('div','name',d.name));tx.appendChild(el('div','state',s.t));top.appendChild(tx);
      var meta=el('div','meta');meta.appendChild(el('span','tag',d.loc==='p'?'내 PC':'클라우드'));meta.appendChild(el('span',null,d.time));
      b.appendChild(top);b.appendChild(meta);b.appendChild(el('p','detail',d.text||'기록 없음'));
      if(d.id)b.appendChild(el('span','go','세션 열기 ↗'));
      g.appendChild(b);
    });
    room.appendChild(g);box.appendChild(room);
  });
}
function routines(){
  var sc=$('sched');sc.textContent='';
  if(!state.sched.length)sc.appendChild(el('p','empty','켜져 있는 반복 예약이 없습니다.'));
  state.sched.forEach(function(s){
    var r=el('div','row');r.appendChild(el('div','when',s.when));
    var m=el('div');m.appendChild(el('div',null,s.name));m.appendChild(el('small',null,s.sub));r.appendChild(m);
    r.appendChild(el('div','next',s.next));sc.appendChild(r);
  });
  $('schedNote').textContent=state.live?'연결된 계정의 예약 목록에서 읽었습니다. 한 번 실행하고 꺼진 알림 예약은 뺐습니다.':'스냅샷입니다. 첫 페이지(최근 30개)만 읽었고, 한 번 실행하고 꺼진 알림 예약은 뺐습니다.';
}
function renderAll(){home();chips();rooms();routines()}

function setConn(kind,text){
  var p=$('conn');p.className='pill'+(kind==='live'?' on':'');
  p.style.setProperty('--c',kind==='live'?'var(--run)':kind==='bad'?'var(--bad)':'var(--wait)');
  $('connText').textContent=text;
}
function go(v){location.hash=v}
function show(){
  var v=(location.hash||'#home').slice(1);if(['home','rooms','routines'].indexOf(v)<0)v='home';
  ['home','rooms','routines'].forEach(function(k){
    $('v-'+k).hidden=(k!==v);$('tab-'+k).setAttribute('aria-selected',k===v?'true':'false');
  });
}
document.querySelectorAll('.tab').forEach(function(b){b.onclick=function(){go(b.getAttribute('data-v'))}});
window.addEventListener('hashchange',show);

// ----- 실시간 연결 -----
function onErr(e){
  var c=e&&e.code;
  $('refresh').hidden=true;
  if(c==='not_in_manifest'||c==='approval_required'||c==='consent_required'){
    setConn('wait','연결 허용이 필요합니다. 스냅샷 표시 중');$('allow').hidden=false;
  }else if(c==='server_not_connected'||c==='needs_reauth'||c==='selection_required'){
    setConn('bad','Claude Code Remote 커넥터가 연결되어 있지 않습니다. 스냅샷 표시 중');
  }else if(c==='blocked_by_policy'){
    setConn('bad','조직 정책으로 막혀 있습니다. 스냅샷 표시 중');
  }else if(c==='server_unavailable'||c==='upstream_error'){
    setConn('wait',(state.live?'일시적으로 갱신이 안 됩니다. 마지막 값 표시 중':'일시적으로 읽지 못했습니다. 스냅샷 표시 중'));
  }else{
    setConn('bad','연결 오류('+(c||'알 수 없음')+'). 스냅샷 표시 중');
  }
}
function stamped(ev){
  var at=ev.result&&ev.result.cache&&ev.result.cache.storedAt?new Date(ev.result.cache.storedAt):new Date();
  state.stamp=at;
  $('stamp').textContent='마지막 갱신 '+kst(at.toISOString())+(ev.result&&ev.result.cache&&ev.result.cache.revalidating?' (새로 읽는 중)':'');
}
var mcpNs=null;
function start(mcp){
  mcpNs=mcp;
  mcp.watchTool(SRV,'list_sessions',{limit:50},function(ev){
    if(ev.type==='error'){onErr(ev.error);return}
    var arr=dig(ev.result&&ev.result.payload);
    if(!arr&&ev.result&&ev.result.content){var tx=ev.result.content.filter(function(c){return c.type==='text'}).map(function(c){return c.text}).join('');arr=dig(tx)}
    if(!arr){setConn('wait','응답을 해석하지 못했습니다. 스냅샷 표시 중');return}
    state.sessions=normSessions(arr);state.live=true;
    setConn('live','실시간 연결됨 · 1분마다 갱신');$('refresh').hidden=false;$('allow').hidden=true;
    stamped(ev);renderAll();
  },{refetchInterval:60000});
  mcp.watchTool(SRV,'list_triggers',{limit:50,enabled:true},function(ev){
    if(ev.type==='error')return;
    var arr=dig(ev.result&&ev.result.payload);
    if(!arr&&ev.result&&ev.result.content){var tx=ev.result.content.filter(function(c){return c.type==='text'}).map(function(c){return c.text}).join('');arr=dig(tx)}
    if(!arr)return;
    state.sched=normSched(arr,state.sessions);routines();
  },{refetchInterval:300000});
}
$('refresh').onclick=function(){
  if(mcpNs&&mcpNs.invalidate){mcpNs.invalidate(SRV).catch(function(){})}
};
$('allow').onclick=function(){
  window.claude.use('permissions').then(function(p){
    if(!p)return;return p.request(['mcp:'+SRV]).then(function(){location.reload()});
  }).catch(function(){});
};

renderAll();show();
setConn('wait','연결 확인 중. 스냅샷 표시 중');
(window.claude&&window.claude.use?window.claude.use('mcp'):Promise.resolve(null)).then(function(mcp){
  if(!mcp){setConn('bad','이 화면에서는 실시간 연결을 쓸 수 없습니다. 스냅샷 표시 중');return}
  start(mcp);
}).catch(function(){setConn('bad','이 화면에서는 실시간 연결을 쓸 수 없습니다. 스냅샷 표시 중')});
</script>
